notebook_slug: "forger-nfx-training"
notebook_title: "Forger NFX Training"
device: cuda
batch_size: 64
epochs: 50
num_workers: 4
data_root: "/kaggle/input/egfx-dataset"
checkpoint_dir: "/kaggle/working/checkpoints"
metrics_out: "/kaggle/working/metrics.json"
log_dir: "/kaggle/working/logs"
repo_url: "https://github.com/FurioColombo/SeletectedTopics2023ForgerNFX.git"
repo_branch: "2025"

# Training Hyperparameters
learning_rate: 0.0008        # Initial step size
scheduler_type: "warmup_plateau"
scheduler_params:
  warmup_steps: 100         # Linear warmup
  mode: "min"               # Reduce when val loss stops decreasing
  factor: 0.5               # Reduce LR by half
  patience: 4               # Wait epochs before reducing
  min_lr: 1.0e-6            # Minimum LR floor

loss_weights:
  mse: 1.0
  esr: 0.01
  spectral: 0.0
